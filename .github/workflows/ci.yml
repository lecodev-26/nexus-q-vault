name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check out pinned nexus-q engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout 458fc393992f4b8030ff594a408620058032e214

      - name: Check frontend password confirmation flows
        run: node --test apps/desktop/ui/password-confirmation.test.js

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run desktop application tests (including Windows hardening tests)
        run: cargo test --manifest-path apps/desktop/Cargo.toml --locked --bin nexus-q-vault-desktop

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check out pinned nexus-q engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout 458fc393992f4b8030ff594a408620058032e214

      - name: Check desktop formatting
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check

      - name: Check desktop application
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build desktop application
        run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
