name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run frontend tests
        run: node --test apps/desktop/ui/i18n/i18n.test.js apps/desktop/ui/password-confirmation.test.js

      - name: Check out pinned NEXUS-Q cryptographic engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout 458fc393992f4b8030ff594a408620058032e214

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path apps/desktop/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run desktop application tests
        run: cargo test --manifest-path apps/desktop/Cargo.toml --locked --bin nexus-q-vault-desktop

      - name: Verify desktop dependency lockfile
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

  build:
    needs: validate
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            artifact_name: windows-installers
            artifact_path: |
              apps/desktop/target/release/bundle/msi/*.msi
              apps/desktop/target/release/bundle/nsis/*.exe
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact_name: macos-installer
            artifact_path: apps/desktop/target/release/bundle/dmg/*.dmg
          - platform: linux
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact_name: linux-installers
            artifact_path: |
              apps/desktop/target/release/bundle/deb/*.deb
              apps/desktop/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out NEXUS-Q Vault
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2t64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned NEXUS-Q cryptographic engine
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lecodev-26/nexus-q.git ../nexus-q
          git -C ../nexus-q checkout 458fc393992f4b8030ff594a408620058032e214

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Verify dependency lockfile
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/Cargo.toml --format-version 1 > /dev/null

      - name: Build native installer bundles
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Write build metadata
        run: |
          mkdir -p release-assets
          VERSION=$(grep -m1 '"version"' apps/desktop/tauri.conf.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          printf "version=%s\ncommit=%s\nplatform=%s\n" "$VERSION" "$GITHUB_SHA" "${{ matrix.platform }}" > "release-assets/BUILD-INFO-${{ matrix.platform }}.txt"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_path }}
            release-assets/BUILD-INFO-${{ matrix.platform }}.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Create draft GitHub Release
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v5

      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify all platform installers and generate checksums
        run: bash scripts/prepare-release-assets.sh release-assets "$GITHUB_SHA"

      - name: Create draft release and attach candidate installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS-Q Vault ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            **NEXUS-Q Vault ${{ github.ref_name }} — early access.**

            This is an early-access release, not a security-audited or production-hardened product. It has not received an independent security audit and should not be the sole protection for high-value or irreplaceable data. Review README.md, SECURITY.md and THREAT_MODEL.md before use.

            **Installers**
            - Linux: `.deb` and `.AppImage`
            - Windows: `.msi` and `.exe`
            - macOS: `.dmg`

            Linux `.deb` and `.AppImage`, Windows `.msi` and `.exe`, and macOS `.dmg` installers are built on native GitHub-hosted Actions runners from this exact Vault commit and the pinned NEXUS-Q Core revision. Each platform build includes `BUILD-INFO-*.txt` metadata. The publish job verifies all five installer formats and all three metadata files against the release commit, then generates and attaches `SHA256SUMS.txt`. Build provenance is not independently verified. Installers are not currently code-signed or notarized.

            **Integrity**
            The final `SHA256SUMS.txt` is generated and attached only after Linux installers have been added and all three build metadata files confirm the same Vault commit. Checksums detect accidental corruption; they are not digital signatures and do not authenticate the publisher.

            **Known limitations**
            - No independent security audit or production-hardening review.
            - No code signing or macOS notarization.
            - Keep `.nqx` files and folder-vault encrypted objects separately; `.nqb` backups do not contain those payloads.
            - Folder encryption currently has a 32 MiB per-file limit and does not preserve empty directories or symbolic links.

            **Full changelog**: https://github.com/lecodev-26/nexus-q-vault/blob/main/CHANGELOG.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
