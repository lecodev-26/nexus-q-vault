[package]
name = "nexus-q-vault-desktop"
version = "0.1.0"
description = "NEXUS-Q Vault cross-platform desktop application"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
nexusq-core = { path = "../../../nexus-q/crates/nexusq-core" }
nexus-q-vault-spike = { path = "../.." }
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.3"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
